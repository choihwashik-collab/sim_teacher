<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 취향 협업 필터링 실습 (교사용 대시보드)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e293b; font-size: 26px; margin-bottom: 5px; }
        p.desc { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .section-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section-title { font-size: 16px; font-weight: bold; color: #334155; margin-bottom: 12px; }
        
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #475569; font-size: 14px; }
        select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: white; box-sizing: border-box; }
        
        .movie-edit-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 250px; overflow-y: auto; }
        .movie-edit-item { display: flex; gap: 10px; align-items: center; }
        
        button { padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn-secondary:hover { background-color: #475569; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }
        th { background-color: #f1f5f9; color: #334155; }
        
        .match-card { background: white; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .no-data { text-align: center; color: #94a3b8; padding: 30px; font-style: italic; }
    </style>
</head>
<body onload="initDashboard()">

<div class="container">
    <h1>📊 교사 전용 분석 대시보드</h1>
    <p class="desc">웹 화면에서 영화 목록을 직접 편집하고, 학급별 데이터 수집 및 코사인 유사도 분석을 관리합니다.</p>

    <!-- 1. 영화 목록 직접 편집 섹션 (스프레드시트 열 필요 없음!) -->
    <div class="section-box">
        <div class="section-title">🎬 출제할 영화 목록 관리 (웹에서 바로 수정)</div>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 12px;">
            * 아래 입력된 영화들은 학생들이 설문할 때 실시간으로 반영됩니다. 수정 후 <b>[설정 저장하기]</b>를 꼭 눌러주세요.
        </p>
        <div id="movieEditContainer" class="movie-edit-list">
            <div style="color: #94a3b8; font-size: 13px;">영화 목록을 불러오는 중...</div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-secondary" onclick="addMovieInput()">+ 영화 추가하기</button>
            <button class="btn-success" onclick="saveMovieSettings()">💾 설정 저장하기</button>
        </div>
    </div>

    <!-- 2. 학급 선택 및 제어 패널 -->
    <div class="section-box">
        <div class="section-title">🎯 학급별 데이터 분석 및 관리</div>
        <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
                <label for="targetClass">조회할 학급 선택</label>
                <select id="targetClass">
                    <option value="1반">1반</option>
                    <option value="2반">2반</option>
                    <option value="3반">3반</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" onclick="loadClassData()">데이터 불러오기 🔄</button>
                <button class="btn-danger" onclick="resetClassData()">테스트 데이터 초기화 🗑️</button>
            </div>
        </div>
    </div>

    <!-- 3. 결과 대시보드 영역 -->
    <div id="dataContainer" class="section-box" style="background: white;">
        <div class="no-data">상단에서 조회할 학급을 선택하고 [데이터 불러오기] 버튼을 눌러주세요.</div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOMEjTqsN-yxn22NZ3NNBQuUY73kQfnfJ8joaUtgPrgphXI6Io1m8ZTkn98z-TUvkaxg/exec";
    
    let currentMovies = [];
    let studentDataList = [];

    async function initDashboard() {
        await loadCurrentMoviesForEdit();
    }

    // 백엔드에서 영화 목록을 가져와서 input 폼으로 렌더링
    async function loadCurrentMoviesForEdit() {
        const container = document.getElementById('movieEditContainer');
        container.innerHTML = `<div style="color: #94a3b8; font-size: 13px;">영화 목록 로딩 중...</div>`;

        try {
            const response = await fetch(`${SCRIPT_URL}?action=getMovies`);
            const movies = await response.json();
            currentMovies = movies;
            renderMovieInputs(movies);
        } catch (error) {
            console.error("영화 로드 실패:", error);
            container.innerHTML = `<div style="color: #ef4444; font-size: 13px;">영화 목록 로드 실패</div>`;
        }
    }

    function renderMovieInputs(movies) {
        const container = document.getElementById('movieEditContainer');
        container.innerHTML = '';

        movies.forEach((movie, index) => {
            const item = document.createElement('div');
            item.className = 'movie-edit-item';
            item.innerHTML = `
                <span style="font-weight: bold; color: #475569; width: 30px; text-align: right;">${index + 1}.</span>
                <input type="text" class="movie-name-input" value="${movie}" placeholder="영화 제목 입력" style="flex: 1;">
                <button class="btn-danger" style="padding: 8px 12px; font-size: 13px;" onclick="removeMovieInput(this)">삭제</button>
            `;
            container.appendChild(item);
        });
    }

    function addMovieInput() {
        const container = document.getElementById('movieEditContainer');
        const index = container.children.length + 1;
        const item = document.createElement('div');
        item.className = 'movie-edit-item';
        item.innerHTML = `
            <span style="font-weight: bold; color: #475569; width: 30px; text-align: right;">${index}.</span>
            <input type="text" class="movie-name-input" value="" placeholder="영화 제목 입력" style="flex: 1;">
            <button class="btn-danger" style="padding: 8px 12px; font-size: 13px;" onclick="removeMovieInput(this)">삭제</button>
        `;
        container.appendChild(item);
    }

    function removeMovieInput(btn) {
        btn.parentElement.remove();
        // 번호 재정렬
        const container = document.getElementById('movieEditContainer');
        const items = container.children;
        for (let i = 0; i < items.length; i++) {
            items[i].children[0].innerText = `${i + 1}.`;
        }
    }

    // 수정된 영화 목록을 서버(설정 시트)로 전송하여 저장
    async function saveMovieSettings() {
        const inputs = document.querySelectorAll('.movie-name-input');
        const newMovies = [];
        inputs.forEach(input => {
            const val = input.value.trim();
            if (val) newMovies.push(val);
        });

        if (newMovies.length === 0) {
            alert("최소 1개 이상의 영화를 입력해주세요!");
            return;
        }

        const payload = {
            action: 'saveMovies',
            movies: newMovies
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.result === 'success') {
                alert("✅ 영화 설정이 성공적으로 저장되었습니다! 학생 페이지에 즉시 반영됩니다.");
                await loadCurrentMoviesForEdit();
            } else {
                alert("❌ 저장 실패");
            }
        } catch (error) {
            console.error("저장 통신 에러:", error);
            alert("❌ 서버 통신 중 에러가 발생했습니다.");
        }
    }

    // 학급 데이터 불러오기
    async function loadClassData() {
        const targetClass = document.getElementById('targetClass').value;
        const container = document.getElementById('dataContainer');
        container.innerHTML = `<div class="no-data">[${targetClass}] 데이터를 불러오는 중입니다...</div>`;

        try {
            const [movieRes, dataRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getMovies`),
                fetch(`${SCRIPT_URL}?action=getData&className=${targetClass}`)
            ]);

            currentMovies = await movieRes.json();
            studentDataList = await dataRes.json();

            renderDashboard(targetClass);
        } catch (error) {
            console.error("데이터 로드 에러:", error);
            container.innerHTML = `<div class="no-data" style="color: #ef4444;">데이터를 불러오는 중 에러가 발생했습니다.</div>`;
        }
    }

    function renderDashboard(className) {
        const container = document.getElementById('dataContainer');
        
        if (!studentDataList || studentDataList.length === 0) {
            container.innerHTML = `<div class="no-data">📦 [${className}]에 제출된 데이터가 아직 없습니다.</div>`;
            return;
        }

        let html = `<h3 style="margin-top: 0; color: #1e293b;">📌 [${className}] 제출 현황 (총 ${studentDataList.length}명 참여)</h3>`;
        
        html += `<div style="overflow-x: auto; max-height: 300px; margin-bottom: 20px;"><table><thead><tr><th>반</th><th>이름</th><th>제출시간</th>`;
        currentMovies.forEach(m => { html += `<th>${m}</th>`; });
        html += `</tr></thead><tbody>`;

        studentDataList.forEach(row => {
            html += `<tr>`;
            row.forEach(cell => { html += `<td>${cell}</td>`; });
            html += `</tr>`;
        });
        html += `</tbody></table></div>`;

        html += `<div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px;">
                    <h3 style="margin-top: 0; color: #1e293b;">🤝 알고리즘 분석: 코사인 유사도 기반 '찰떡궁합 영화 메이트'</h3>`;

        const matches = calculateCosineSimilarities();
        if (matches.length === 0) {
            html += `<div style="color: #64748b; font-size: 14px;">유사도를 계산하기에 데이터가 부족합니다. (2명 이상 필요)</div>`;
        } else {
            matches.forEach(match => {
                html += `<div class="match-card">
                            <span>👤 <b>${match.studentA}</b> &amp; 👤 <b>${match.studentB}</b></span>
                            <span style="color: #2563eb; font-weight: bold;">유사도 점수: ${(match.similarity * 100).toFixed(1)}점</span>
                         </div>`;
            });
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    function calculateCosineSimilarities() {
        if (studentDataList.length < 2) return [];
        const vectors = studentDataList.map(row => ({
            name: row[1],
            ratings: row.slice(3).map(Number)
        }));

        let pairs = [];
        for (let i = 0; i < vectors.length; i++) {
            for (let j = i + 1; j < vectors.length; j++) {
                const sim = cosineSimilarity(vectors[i].ratings, vectors[j].ratings);
                pairs.push({
                    studentA: vectors[i].name,
                    studentB: vectors[j].name,
                    similarity: isNaN(sim) ? 0 : sim
                });
            }
        }
        pairs.sort((a, b) => b.similarity - a.similarity);
        return pairs.slice(0, 5);
    }

    function cosineSimilarity(vecA, vecB) {
        let dotProduct = 0, normA = 0, normB = 0;
        for (let i = 0; i < vecA.length; i++) {
            dotProduct += vecA[i] * vecB[i];
            normA += vecA[i] * vecA[i];
            normB += vecB[i] * vecB[i];
        }
        if (normA === 0 || normB === 0) return 0;
        return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    async function resetClassData() {
        const targetClass = document.getElementById('targetClass').value;
        if (!confirm(`⚠️ 경고: [${targetClass}]의 모든 제출 데이터를 삭제하시겠습니까?`)) return;

        const payload = { action: 'clearData', className: targetClass };
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (result.result === 'success') {
                alert(`✅ [${targetClass}] 데이터가 초기화되었습니다.`);
                loadClassData();
            } else {
                alert("❌ 초기화 실패");
            }
        } catch (error) {
            alert("❌ 통신 에러 발생");
        }
    }
</script>
</body>
</html>
