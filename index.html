<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 취향 협업 필터링 실습 (교사용 대시보드)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e293b; font-size: 26px; margin-bottom: 5px; }
        p.desc { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .section-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section-title { font-size: 16px; font-weight: bold; color: #334155; margin-bottom: 12px; }
        
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #475569; font-size: 14px; }
        select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: white; box-sizing: border-box; }
        
        .movie-edit-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 250px; overflow-y: auto; }
        .movie-edit-item { display: flex; gap: 10px; align-items: center; }
        
        button { padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn-secondary:hover { background-color: #475569; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px; text-align: center; }
        th { background-color: #f1f5f9; color: #334155; }
        .train-col { background-color: #f8fafc; }
        .test-col { background-color: #eff6ff; color: #1e40af; font-weight: bold; }
        
        /* 매트릭스 테이블 전용 스타일 (최대 45명 대응 컴팩트 사이즈) */
        .matrix-table { font-size: 11px; }
        .matrix-table th, .matrix-table td { width: 35px; height: 30px; padding: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
        .matrix-name-th { min-width: 70px; background-color: #f8fafc; font-weight: bold; }

        .match-card { background: white; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin-bottom: 10px; }
        .blind-box { background: #1e293b; color: #94a3b8; padding: 12px; border-radius: 6px; text-align: center; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .blind-box:hover { background: #334155; color: white; }
        .revealed-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 6px; color: #166534; font-size: 14px; }
        
        .no-data { text-align: center; color: #94a3b8; padding: 30px; font-style: italic; }
    </style>
</head>
<body onload="initDashboard()">

<div class="container">
    <h1>📊 교사 전용 분석 대시보드 (협업 필터링 &amp; 매트릭스)</h1>
    <p class="desc">학습용 데이터(1~10번)로 유사도를 계산하고, 최대 45명의 매트릭스 히트맵 및 테스트 영화 검증을 수행합니다.</p>

    <!-- 1. 영화 목록 관리 섹션 -->
    <div class="section-box">
        <div class="section-title">🎬 출제할 영화 목록 관리 (1~10번: 학습용 / 11번 이후: 테스트용)</div>
        <div id="movieEditContainer" class="movie-edit-list">
            <div style="color: #94a3b8; font-size: 13px;">영화 목록을 불러오는 중...</div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-secondary" onclick="addMovieInput()">+ 영화 추가하기</button>
            <button class="btn-success" onclick="saveMovieSettings()">💾 설정 저장하기</button>
        </div>
    </div>

    <!-- 2. 학급 선택 및 제어 패널 -->
    <div class="section-box">
        <div class="section-title">🎯 학급별 데이터 분석 및 검증</div>
        <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
                <label for="targetClass">조회할 학급 선택</label>
                <select id="targetClass">
                    <option value="1반">1반</option>
                    <option value="2반">2반</option>
                    <option value="3반">3반</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" onclick="loadClassData()">데이터 불러오기 🔄</button>
                <button class="btn-danger" onclick="resetClassData()">테스트 데이터 초기화 🗑️</button>
            </div>
        </div>
    </div>

    <!-- 3. 결과 대시보드 영역 -->
    <div id="dataContainer" class="section-box" style="background: white;">
        <div class="no-data">상단에서 조회할 학급을 선택하고 [데이터 불러오기] 버튼을 눌러주세요.</div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOMEjTqsN-yxn22NZ3NNBQuUY73kQfnfJ8joaUtgPrgphXI6Io1m8ZTkn98z-TUvkaxg/exec";
    
    let currentMovies = [];
    let studentDataList = [];

    async function initDashboard() {
        await loadCurrentMoviesForEdit();
    }

    async function loadCurrentMoviesForEdit() {
        const container = document.getElementById('movieEditContainer');
        container.innerHTML = `<div style="color: #94a3b8; font-size: 13px;">영화 목록 로딩 중...</div>`;

        try {
            const response = await fetch(`${SCRIPT_URL}?action=getMovies`);
            const movies = await response.json();
            currentMovies = movies;
            renderMovieInputs(movies);
        } catch (error) {
            container.innerHTML = `<div style="color: #ef4444; font-size: 13px;">영화 목록 로드 실패</div>`;
        }
    }

    function renderMovieInputs(movies) {
        const container = document.getElementById('movieEditContainer');
        container.innerHTML = '';

        movies.forEach((movie, index) => {
            const isTest = index >= 10; // 1~10번은 학습용, 11번부터는 테스트용
            const badgeText = isTest ? ` [TEST ${index + 1}]` : ` [TRAIN ${index + 1}]`;
            
            const item = document.createElement('div');
            item.className = 'movie-edit-item';
            item.innerHTML = `
                <span style="font-weight: bold; color: ${isTest ? '#2563eb' : '#475569'}; width: 90px; text-align: right;">${index + 1}.${badgeText}</span>
                <input type="text" class="movie-name-input" value="${movie}" placeholder="영화 제목 입력" style="flex: 1;">
                <button class="btn-danger" style="padding: 8px 12px; font-size: 13px;" onclick="removeMovieInput(this)">삭제</button>
            `;
            container.appendChild(item);
        });
    }

    function addMovieInput() {
        const container = document.getElementById('movieEditContainer');
        const index = container.children.length + 1;
        const isTest = index > 10;
        const badgeText = isTest ? ` [TEST ${index}]` : ` [TRAIN ${index}]`;

        const item = document.createElement('div');
        item.className = 'movie-edit-item';
        item.innerHTML = `
            <span style="font-weight: bold; color: ${isTest ? '#2563eb' : '#475569'}; width: 90px; text-align: right;">${index}.${badgeText}</span>
            <input type="text" class="movie-name-input" value="" placeholder="영화 제목 입력" style="flex: 1;">
            <button class="btn-danger" style="padding: 8px 12px; font-size: 13px;" onclick="removeMovieInput(this)">삭제</button>
        `;
        container.appendChild(item);
    }

    function removeMovieInput(btn) {
        btn.parentElement.remove();
        const container = document.getElementById('movieEditContainer');
        const items = container.children;
        for (let i = 0; i < items.length; i++) {
            const isTest = i >= 10;
            const badgeText = isTest ? ` [TEST ${i + 1}]` : ` [TRAIN ${i + 1}]`;
            items[i].children[0].innerText = `${i + 1}.${badgeText}`;
            items[i].children[0].style.color = isTest ? '#2563eb' : '#475569';
        }
    }

    async function saveMovieSettings() {
        const inputs = document.querySelectorAll('.movie-name-input');
        const newMovies = [];
        inputs.forEach(input => {
            const val = input.value.trim();
            if (val) newMovies.push(val);
        });

        if (newMovies.length < 11) {
            alert("최소 11개 이상의 영화가 필요합니다 (1~10번 학습용, 11번 이상 테스트용).");
            return;
        }

        const payload = { action: 'saveMovies', movies: newMovies };
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();
            if (result.result === 'success') {
                alert("✅ 영화 설정이 저장되었습니다!");
                await loadCurrentMoviesForEdit();
            } else { alert("❌ 저장 실패"); }
        } catch (error) { alert("❌ 통신 에러 발생"); }
    }

    async function loadClassData() {
        const targetClass = document.getElementById('targetClass').value;
        const container = document.getElementById('dataContainer');
        container.innerHTML = `<div class="no-data">[${targetClass}] 데이터를 불러오는 중입니다...</div>`;

        try {
            const [movieRes, dataRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getMovies`),
                fetch(`${SCRIPT_URL}?action=getData&className=${targetClass}`)
            ]);

            currentMovies = await movieRes.json();
            studentDataList = await dataRes.json();

            renderDashboard(targetClass);
        } catch (error) {
            container.innerHTML = `<div class="no-data" style="color: #ef4444;">데이터를 불러오는 중 에러가 발생했습니다.</div>`;
        }
    }

    function renderDashboard(className) {
        const container = document.getElementById('dataContainer');
        
        if (!studentDataList || studentDataList.length === 0) {
            container.innerHTML = `<div class="no-data">📦 [${className}]에 제출된 데이터가 아직 없습니다.</div>`;
            return;
        }

        let html = `<h3 style="margin-top: 0; color: #1e293b;">📌 [${className}] 제출 현황 (총 ${studentDataList.length}명 참여)</h3>`;
        
        // 1. 전체 제출 현황 테이블
        html += `<div style="overflow-x: auto; max-height: 220px; margin-bottom: 25px;"><table><thead><tr><th>반</th><th>이름</th><th>제출시간</th>`;
        currentMovies.forEach((m, idx) => {
            const isTest = idx >= 10;
            html += `<th class="${isTest ? 'test-col' : 'train-col'}">${m} ${isTest ? '(TEST)' : '(Train)'}</th>`;
        });
        html += `</tr></thead><tbody>`;

        studentDataList.forEach(row => {
            html += `<tr>`;
            row.forEach(cell => { html += `<td>${cell}</td>`; });
            html += `</tr>`;
        });
        html += `</tbody></table></div>`;

        // 2. 학생 간 유사도 매트릭스 (히트맵 컬러 코딩) 추가
        html += renderSimilarityMatrix();

        // 3. 훈련 데이터(1~10번) 기반 톱 5 메이트 & 테스트 영화(11번~) 블라인드 비교 영역
        html += `<div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px;">
                    <h3 style="margin-top: 0; color: #1e293b;">🤝 훈련 데이터(1~10번) 기반 '톱 5 영화 메이트' &amp; 테스트 검증</h3>
                    <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">1~10번 영화 벡터의 코사인 유사도로 메이트를 선정하고, 테스트 영화들의 일치도를 비교합니다.</p>`;

        const matches = calculateTrainSimilarities();
        if (matches.length === 0) {
            html += `<div style="color: #64748b; font-size: 14px;">유사도를 계산하기에 데이터가 부족합니다. (2명 이상 필요)</div>`;
        } else {
            matches.forEach((match, pairIdx) => {
                html += `<div class="match-card">
                            <div class="match-header">
                                <span>👤 <b>${match.studentA}</b> &amp; 👤 <b>${match.studentB}</b> (학습 유사도: <span style="color: #2563eb;">${(match.similarity * 100).toFixed(1)}점</span>)</span>
                            </div>
                            <div id="blind-box-${pairIdx}" class="blind-box" onclick="revealTest(${pairIdx})">
                                🔒 [클릭] 테스트 영화(11번 이후) 평가 결과 비교하기
                            </div>
                            <div id="reveal-box-${pairIdx}" style="display: none;" class="revealed-box">
                                <b>🎯 테스트 영화 비교 결과</b><br>`;
                
                // 테스트 영화들(인덱스 10 이상) 비교 출력
                for (let i = 10; i < currentMovies.length; i++) {
                    const movieName = currentMovies[i];
                    const scoreA = match.studentARow.slice(3)[i];
                    const scoreB = match.studentBRow.slice(3)[i];
                    html += `• <b>${movieName}</b>: ${match.studentA}(${scoreA}점) vs ${match.studentB}(${scoreB}점) ${scoreA == scoreB ? '✨ 일치!' : ''}<br>`;
                }
                html += `</div></div>`;
            });
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    // 최대 45명 참여 시 가시성을 높인 유사도 매트릭스(히트맵) 생성 함수
    function renderSimilarityMatrix() {
        if (studentDataList.length < 2) return '';
        
        const trainCount = Math.min(10, currentMovies.length);
        const vectors = studentDataList.map(row => ({
            name: row[1],
            ratings: row.slice(3, 3 + trainCount).map(Number)
        }));

        let html = `<div style="margin-bottom: 25px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px;">
                    <h3 style="margin-top: 0; color: #1e293b;">🔥 학생 간 유사도 매트릭스 (Heatmap)</h3>
                    <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">1~10번 학습 데이터를 기준으로 모든 학생 간 코사인 유사도를 계산했습니다. 색상이 진할수록 취향이 유사합니다.</p>
                    <div style="overflow-x: auto; max-height: 350px;">
                    <table class="matrix-table"><thead><tr><th class="matrix-name-th">학생</th>`;

        vectors.forEach(v => {
            html += `<th>${v.name}</th>`;
        });
        html += `</tr></thead><tbody>`;

        vectors.forEach((v1, i) => {
            html += `<tr><th class="matrix-name-th">${v1.name}</th>`;
            vectors.forEach((v2, j) => {
                if (i === j) {
                    html += `<td style="background-color: #cbd5e1; color: #64748b;">-</td>`;
                } else {
                    const sim = cosineSimilarity(v1.ratings, v2.ratings);
                    // 유사도(0~1)에 따라 파란색 계열의 투명도/진하기 조절 (진할수록 유사)
                    const alpha = isNaN(sim) ? 0 : sim;
                    const bgColor = `rgba(37, 99, 235, ${alpha.toFixed(2)})`;
                    const textColor = alpha > 0.6 ? 'white' : '#333';
                    html += `<td style="background-color: ${bgColor}; color: ${textColor};" title="${v1.name} & ${v2.name}: ${(sim * 100).toFixed(1)}%">${(sim * 100).toFixed(0)}</td>`;
                }
            });
            html += `</tr>`;
        });

        html += `</tbody></table></div></div>`;
        return html;
    }

    // 1~10번 학습용 데이터만 사용하여 유사도 계산
    function calculateTrainSimilarities() {
        if (studentDataList.length < 2) return [];
        const trainCount = Math.min(10, currentMovies.length);

        const vectors = studentDataList.map(row => ({
            name: row[1],
            row: row,
            ratings: row.slice(3, 3 + trainCount).map(Number)
        }));

        let pairs = [];
        for (let i = 0; i < vectors.length; i++) {
            for (let j = i + 1; j < vectors.length; j++) {
                const sim = cosineSimilarity(vectors[i].ratings, vectors[j].ratings);
                pairs.push({
                    studentA: vectors[i].name,
                    studentB: vectors[j].name,
                    studentARow: vectors[i].row,
                    studentBRow: vectors[j].row,
                    similarity: isNaN(sim) ? 0 : sim
                });
            }
        }
        pairs.sort((a, b) => b.similarity - a.similarity);
        return pairs.slice(0, 5);
    }

    function cosineSimilarity(vecA, vecB) {
        let dotProduct = 0, normA = 0, normB = 0;
        for (let i = 0; i < vecA.length; i++) {
            dotProduct += vecA[i] * vecB[i];
            normA += vecA[i] * vecA[i];
            normB += vecB[i] * vecB[i];
        }
        if (normA === 0 || normB === 0) return 0;
        return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    function revealTest(pairIdx) {
        document.getElementById(`blind-box-${pairIdx}`).style.display = 'none';
        document.getElementById(`reveal-box-${pairIdx}`).style.display = 'block';
    }

    async function resetClassData() {
        const targetClass = document.getElementById('targetClass').value;
        if (!confirm(`⚠️ 경고: [${targetClass}]의 모든 제출 데이터를 삭제하시겠습니까?`)) return;

        const payload = { action: 'clearData', className: targetClass };
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();
            if (result.result === 'success') {
                alert(`✅ [${targetClass}] 데이터가 초기화되었습니다.`);
                loadClassData();
            } else { alert("❌ 초기화 실패"); }
        } catch (error) { alert("❌ 통신 에러 발생"); }
    }
</script>
</body>
</html>
